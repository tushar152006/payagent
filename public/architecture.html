<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayAgent AI — Architecture Flowchart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #060911;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      min-height: 100vh;
      color: #f1f5f9;
    }
    .toolbar {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 12px 18px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      font-size: 13px;
    }
    .toolbar-title {
      font-weight: 700;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #38bdf8;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-secondary:hover {
      background: #334155;
      color: #ffffff;
    }
    .diagram-container {
      width: 100%;
      max-width: 1000px;
      background: #090d16;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      border: 1px solid #1e293b;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-title">
      <span style="font-size: 16px;">⚡</span> PayAgent AI Technical System Architecture
    </div>
    <div class="toolbar-actions">
      <button class="btn" onclick="downloadPNG()">Download 2x PNG</button>
      <a class="btn btn-secondary" href="/architecture.svg" download="architecture.svg">Save SVG</a>
    </div>
  </div>

  <div id="diagramContainer" class="diagram-container">
    <img id="svgImg" src="/architecture.svg" alt="PayAgent AI Architecture Flowchart" />
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    function downloadPNG() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        const canvas = document.getElementById('hiddenCanvas');
        canvas.width = 2000;
        canvas.height = 2400;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#090D16';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const link = document.createElement('a');
        link.download = 'architecture.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = '/architecture.svg';
    }
  </script>

</body>
</html>
