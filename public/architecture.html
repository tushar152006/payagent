<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayAgent AI — Architecture Flowchart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      min-height: 100vh;
    }
    .toolbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding: 10px 16px;
      background: #0f172a;
      color: #ffffff;
      border-radius: 8px;
      font-size: 13px;
    }
    .toolbar-title {
      font-weight: 600;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .btn:hover {
      background: #0369a1;
    }
    .diagram-container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      border: 1px solid #cbd5e1;
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <div class="toolbar-title">
      <span>⚙️</span> PayAgent AI System Architecture Flowchart
    </div>
    <div class="toolbar-actions">
      <span style="color: #94a3b8; font-size: 11px;">Press Win + Shift + S to snip, or</span>
      <button class="btn" onclick="downloadPNG()">Download PNG</button>
      <a class="btn" style="background:#334155" href="/architecture.svg" download="architecture.svg">Download SVG</a>
    </div>
  </div>

  <div id="diagramContainer" class="diagram-container">
    <!-- Inline SVG Diagram for crisp rendering -->
    <img id="svgImg" src="/architecture.svg" alt="PayAgent AI Architecture Flowchart" style="width:100%; height:auto;" />
  </div>

  <canvas id="hiddenCanvas" style="display:none;"></canvas>

  <script>
    function downloadPNG() {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function() {
        const canvas = document.getElementById('hiddenCanvas');
        canvas.width = 1800; // 2x high resolution
        canvas.height = 2040;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const link = document.createElement('a');
        link.download = 'architecture.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      };
      img.src = '/architecture.svg';
    }
  </script>

</body>
</html>
