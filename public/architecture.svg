        <rect width="390" height="58" rx="6" fill="#003087" stroke="#00215e" stroke-width="1" />
        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">PayPal 180-Day Buyer Protection Net</text>
        <text x="16" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#BAE6FD">
