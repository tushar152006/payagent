      <rect x="8" y="8" width="60" height="18" rx="3" fill="#E2E8F0" />
      <text x="38" y="20.5" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1E293B" text-anchor="middle">GATE 01</text>
      <text x="76" y="22" font-size="12" font-weight="600" fill="#0F172A">Semantic Intent &amp; Injection Defense</text>
      <text x="12" y="42" font-size="11" fill="#475569">Cosine vector distance between assigned task goal and checkout SKU items (Cosine ≥ 0.85).</text>
      <text x="12" y="56" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#0369A1">Filter: 6-Engine Regex halts DAN, system prompt overrides &amp; fund leaks.</text>
    </g>

    <!-- Connector Gate 1 -> Gate 2 -->
    <line x1="300" y1="100" x2="300" y2="114" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Gate 02 -->
    <g transform="translate(20, 118)">
      <rect width="560" height="64" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <rect x="8" y="8" width="60" height="18" rx="3" fill="#E2E8F0" />
      <text x="38" y="20.5" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#1E293B" text-anchor="middle">GATE 02</text>
      <text x="76" y="22" font-size="12" font-weight="600" fill="#0F172A">Merchant Authentication &amp; Typosquat Defense</text>
      <text x="12" y="42" font-size="11" fill="#475569">Cross-checks target merchant domain against authorized enterprise vendor registry.</text>
      <text x="12" y="56" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#0369A1">Filter: Levenshtein distance check blocks lookalike clone phishing (evil-aws.com).</text>
