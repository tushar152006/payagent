    <text x="122" y="4" font-size="10.5" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#FFFFFF" text-anchor="middle">1. AUTONOMOUS AGENT LAYER</text>
    
    <text x="20" y="28" font-size="12" font-weight="600" fill="#1E293B">Untrusted AI Entities (DevOps AutoScaler, Procurement Bot, Web Scraper)</text>
    <text x="20" y="46" font-size="11" font-family="'JetBrains Mono', monospace" fill="#475569">POST /v1/intent { agent_id: "agt_01", merchant: "github.com", amount: 19.00 }</text>
    <text x="20" y="62" font-size="10" fill="#94A3B8" font-style="italic">Constraint: Agents hold ZERO static credit cards or persistent credentials.</text>
  </g>

  <!-- Flow Arrow: Agent -> Firewall -->
  <line x1="450" y1="187" x2="450" y2="225" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />
  <rect x="300" y="196" width="300" height="18" rx="9" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
  <text x="450" y="209" font-size="9.5" font-family="'JetBrains Mono', monospace" font-weight="500" fill="#334155" text-anchor="middle">Pre-Execution Interception Envelope</text>

  <!-- ==================== 2. DETERMINISTIC FIREWALL ENGINE ==================== -->
  <g transform="translate(150, 230)">
    <!-- Firewall Outer Boundary Box -->
    <rect width="600" height="380" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2" stroke-dasharray="none" />
    
    <!-- Firewall Header Pill -->
    <rect x="16" y="-12" width="410" height="22" rx="4" fill="#0F172A" />
    <text x="221" y="3" font-size="11" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. PAYAGENT DETERMINISTIC FIREWALL (Sub-16ms)</text>

    <!-- Subtitle -->
    <text x="20" y="26" font-size="11" fill="#64748B">Sequential Zero-Trust Pipeline: Fails closed on any policy anomaly</text>

    <!-- Gate 01 -->
    <g transform="translate(20, 36)">
