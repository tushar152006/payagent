      <text x="76" y="22" font-size="12" font-weight="600" fill="#0F172A">Loop &amp; Smurfing Circuit Breaker</text>
      <text x="12" y="42" font-size="11" fill="#475569">Sliding 60-second frequency limiter halts recursive API loops (max 5 tx/min).</text>
      <text x="12" y="56" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#0369A1">Throttle: Rolling 10-minute cumulative velocity cap prevents smurfing ($300 limit).</text>
    </g>

    <text x="580" y="366" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94A3B8" text-anchor="end">Engine Latency: 14.2ms</text>
  </g>

  <!-- Flow Arrow: Firewall -> Decision Diamond -->
  <line x1="450" y1="610" x2="450" y2="648" stroke="#334155" stroke-width="1.75" marker-end="url(#arrow)" />

  <!-- ==================== 3. DECISION DIAMOND ==================== -->
  <g transform="translate(450, 680)">
    <!-- Diamond -->
    <polygon points="0,-32 100,0 0,32 -100,0" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.75" />
    <text y="-4" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">ALL 4 GATES</text>
    <text y="12" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">PASSED?</text>
  </g>

