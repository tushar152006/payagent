        <text x="125" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Immutable Audit Ledger</text>
        <text x="125" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FFEDD5" text-anchor="middle">Forensic Trail &amp; Threat Scores</text>
      </g>

      <!-- Box 4B -->
      <g transform="translate(275, 0)">
        <rect width="250" height="60" rx="6" fill="#EA580C" stroke="#C2410C" stroke-width="1" />
        <text x="125" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Digital Receipt Store</text>
        <text x="125" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FFEDD5" text-anchor="middle">SHA-256 Item &amp; Vendor Hashes</text>
      </g>

      <!-- Box 4C -->
