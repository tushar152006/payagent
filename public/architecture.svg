        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">Gate 01: Semantic Intent &amp; Injection Shield</text>
        <text x="16" y="42" font-size="10.5" fill="#FFE4E6">Cosine distance matching goal vs SKU (Cosine ≥ 0.85)</text>
        <text x="16" y="58" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#FECDD3">6-Engine Regex: Blocks DAN, system overrides &amp; leaks</text>
      </g>

      <!-- Gate 02 -->
      <g transform="translate(410, 0)">
        <rect width="390" height="70" rx="6" fill="#E11D48" stroke="#BE123C" stroke-width="1" />
        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">Gate 02: Merchant Registry &amp; Anti-Typosquat</text>
        <text x="16" y="42" font-size="10.5" fill="#FFE4E6">Strict FQDN allowlist (AWS, GitHub, Vercel, Datadog)</text>
        <text x="16" y="58" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#FECDD3">Levenshtein check blocks clone domains (evil-aws.com)</text>
      </g>

      <!-- Gate 03 -->
