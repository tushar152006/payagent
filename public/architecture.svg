<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1020" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16A34A" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284C7" />
    </marker>

    <!-- Subtle Background Dot Grid -->
    <pattern id="grid-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#E2E8F0" />
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="1020" fill="#FFFFFF" />
  <rect width="900" height="1020" fill="url(#grid-dots)" />

  <!-- Outer Border Container -->
  <rect x="20" y="20" width="860" height="980" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Header Section -->
  <g transform="translate(450, 58)" text-anchor="middle">
    <text font-size="19" font-weight="700" fill="#0F172A" letter-spacing="-0.3">PAYAGENT AI — SYSTEM ARCHITECTURE FLOWCHART</text>
    <text y="22" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B">Deterministic Pre-Execution Spend Firewall &amp; Ephemeral Settlement Protocol</text>
  </g>
  <line x1="20" y1="95" x2="880" y2="95" stroke="#E2E8F0" stroke-width="1" />

  <!-- ==================== 1. AUTONOMOUS AGENT LAYER ==================== -->
  <g transform="translate(180, 115)">
    <!-- Box -->
    <rect width="540" height="72" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" />
    <!-- Node Label -->
