        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">15-Minute Auto-Destruct Scheduler (TTL)</text>
        <text x="16" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#A7F3D0">
          Unclaimed tokens burn automatically • Zero lingering risk
        </text>
      </g>

      <!-- Box 3D -->
