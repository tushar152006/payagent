        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">Linearizable Idempotency Cache (DDIA)</text>
        <text x="16" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#BAE6FD">
