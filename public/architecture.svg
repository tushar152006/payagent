  <!-- ==================== FOOTER ACADEMIC CITATION ==================== -->
  <g transform="translate(480, 1084)" text-anchor="middle">
    <text font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#64748B">
      Architectural Foundations: Kleppmann (DDIA) • Nygard (Release It!) • Google SRE Zero-Trust • OWASP LLM01/06
    </text>
