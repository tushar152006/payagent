  <!-- Connector Right -->
  <path d="M 550 680 L 680 680 L 680 735" fill="none" stroke="#16A34A" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="560" y="663" width="110" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1" />
  <text x="615" y="676" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#16A34A" text-anchor="middle">[YES: ALL PASS]</text>

  <g transform="translate(550, 740)">
    <rect width="260" height="150" rx="6" fill="#F0FDF4" stroke="#16A34A" stroke-width="1.75" />
    <rect x="10" y="-10" width="195" height="20" rx="3" fill="#16A34A" />
    <text x="107" y="4" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#FFFFFF" text-anchor="middle">PAYPAL ORDERS V2 ENGINE</text>
    
    <text x="14" y="26" font-size="11.5" font-weight="700" fill="#14532D">Ephemeral Settlement Minted</text>
    <text x="14" y="46" font-size="11" fill="#166534">• Single-Use Scoped Auth Token</text>
    <text x="14" y="64" font-size="11" fill="#166534">• 15-Minute Auto-Destruct (TTL)</text>
    <text x="14" y="82" font-size="11" fill="#166534">• Exact Amount Lock ($0.00 Slippage)</text>
    <text x="14" y="100" font-size="11" fill="#166534">• Cryptographic SKU &amp; FQDN Bind</text>
    <text x="14" y="118" font-size="11" fill="#166534">• 180-Day Buyer Protection Net</text>
    
    <rect x="12" y="128" width="236" height="16" rx="3" fill="#DCFCE7" />
    <text x="130" y="140" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#15803D" text-anchor="middle">STATUS: SETTLED VIA PAYPAL V2</text>
  </g>

  <!-- Down Arrow to Final Output -->
  <line x1="680" y1="890" x2="680" y2="920" stroke="#16A34A" stroke-width="1.75" marker-end="url(#arrow-green)" />

  <!-- Final Output Box -->
  <g transform="translate(550, 925)">
    <rect width="260" height="42" rx="5" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.25" />
    <text x="130" y="18" font-size="11" font-weight="600" fill="#0F172A" text-anchor="middle">Merchant Order Fulfilled</text>
    <text x="130" y="32" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#64748B" text-anchor="middle">Audit Ledger Receipt Stamped (SHA-256)</text>
  </g>

  <!-- ==================== FOOTER SPECIFICATIONS ==================== -->
  <g transform="translate(450, 988)" text-anchor="middle">
    <text font-size="10" font-family="'JetBrains Mono', monospace" fill="#94A3B8">
      Foundations: Kleppmann (DDIA Idempotency) • Nygard (Release It! Circuit Breakers) • Google SRE Zero-Trust • OWASP LLM01/06
    </text>
  </g>

</svg>
