      <text x="76" y="22" font-size="12" font-weight="600" fill="#0F172A">Delegated Budget Ceilings &amp; Slippage Lock</text>
      <text x="12" y="42" font-size="11" fill="#475569">Evaluates single-transaction ceiling ($100 max) and cumulative monthly allocation.</text>
      <text x="12" y="56" font-size="10.5" font-family="'JetBrains Mono', monospace" fill="#0369A1">Enforcement: Cryptographic SKU lock with $0.00 slippage tolerance.</text>
    </g>

    <!-- Connector Gate 3 -> Gate 4 -->
    <line x1="300" y1="264" x2="300" y2="278" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)" />

