        <rect width="390" height="70" rx="6" fill="#BE123C" stroke="#9F1239" stroke-width="1" />
        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">Gate 03: Delegated Budget &amp; SKU Line-Item Lock</text>
        <text x="16" y="42" font-size="10.5" fill="#FFE4E6">Per-task ceiling ($50–$1,000) &amp; monthly budget tracking</text>
        <text x="16" y="58" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#FECDD3">Cryptographic SKU lock: $0.00 slippage tolerance</text>
      </g>

      <!-- Gate 04 -->
