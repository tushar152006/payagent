        <rect width="390" height="70" rx="6" fill="#BE123C" stroke="#9F1239" stroke-width="1" />
        <text x="16" y="24" font-size="12" font-weight="700" fill="#FFFFFF">Gate 04: Loop &amp; Smurfing Circuit Breaker</text>
        <text x="16" y="42" font-size="10.5" fill="#FFE4E6">Sliding 60-second frequency throttle (max 5 tx/min)</text>
        <text x="16" y="58" font-size="9.5" font-family="'JetBrains Mono', monospace" fill="#FECDD3">Rolling 10-min velocity cap prevents micro-smurfing</text>
      </g>
    </g>

