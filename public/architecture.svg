<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1140" width="100%" height="100%" style="background:#F4F6F8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#059669" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="1140" fill="#F4F6F8" />

  <!-- Master Canvas Card (Matches Reference Image 1) -->
  <rect x="30" y="24" width="900" height="1092" rx="12" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5" />

  <!-- Top Title Tab -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="420" height="36" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2" />
    <text x="210" y="23" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="-0.2">
      PayAgent AI — Layered System Architecture
    </text>
  </g>

  <!-- Top Subtitle -->
  <text x="500" y="65" font-size="12" font-family="'JetBrains Mono', monospace" fill="#64748B">
    Autonomous Spend Firewall &amp; Ephemeral Settlement Protocol
  </text>

  <!-- ========================================================================= -->
  <!-- TIER 1: CLIENT & AUTONOMOUS AGENT TIER (Soft Lavender #EEF2FF)            -->
  <!-- ========================================================================= -->
  <g transform="translate(60, 95)">
    <!-- Outer Tier Container -->
