  <rect x="360" y="824" width="240" height="20" rx="4" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1" />
  <text x="480" y="838" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#9A3412" text-anchor="middle">
