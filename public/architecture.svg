        <rect width="250" height="60" rx="6" fill="#D97706" stroke="#B45309" stroke-width="1" />
        <text x="125" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Enterprise Webhooks</text>
        <text x="125" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FEF3C7" text-anchor="middle">Slack, PagerDuty &amp; CFO Alerts</text>
      </g>
    </g>

    <!-- Bottom State Strip inside Tier 4 -->
