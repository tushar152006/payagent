  <!-- Connector Left -->
  <path d="M 350 680 L 220 680 L 220 735" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#arrow-red)" />
  <rect x="235" y="663" width="105" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" />
  <text x="287" y="676" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#DC2626" text-anchor="middle">[NO: VIOLATION]</text>

  <g transform="translate(90, 740)">
    <rect width="260" height="150" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.75" />
    <rect x="10" y="-10" width="165" height="20" rx="3" fill="#DC2626" />
    <text x="92" y="4" font-size="10" font-family="'JetBrains Mono', monospace" font-weight="700" fill="#FFFFFF" text-anchor="middle">EMERGENCY FREEZE</text>
    
    <text x="14" y="26" font-size="11.5" font-weight="700" fill="#991B1B">Deterministic Execution Halt</text>
    <text x="14" y="46" font-size="11" fill="#7F1D1D">• Zero Capital Moved (16ms)</text>
    <text x="14" y="64" font-size="11" fill="#7F1D1D">• Agent Session Key Revoked</text>
    <text x="14" y="82" font-size="11" fill="#7F1D1D">• Rogue API Loop Aborted</text>
    <text x="14" y="100" font-size="11" fill="#7F1D1D">• Forensic Audit Event Logged</text>
    <text x="14" y="118" font-size="11" fill="#7F1D1D">• Optional Supervisory Escrow</text>
    
    <rect x="12" y="128" width="236" height="16" rx="3" fill="#FEE2E2" />
    <text x="130" y="140" font-size="9" font-family="'JetBrains Mono', monospace" font-weight="600" fill="#B91C1C" text-anchor="middle">STATUS: LEAK PREVENTED</text>
  </g>

