      <rect width="800" height="56" rx="6" fill="#C2410C" stroke="#9A3412" stroke-width="1" />
      <text x="400" y="24" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
        Linearizable In-Memory Cache &amp; Persistent Storage Engine
      </text>
      <text x="400" y="44" font-size="10" font-family="'JetBrains Mono', monospace" fill="#FFEDD5" text-anchor="middle">
        Guarantees Strong Consistency across Multi-Agent Concurrency (Kleppmann Chapter 9)
      </text>
    </g>
