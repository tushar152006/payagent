    <line x1="420" y1="76" x2="420" y2="100" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-down)" />
    <line x1="695" y1="76" x2="695" y2="100" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrow-down)" />

