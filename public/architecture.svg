        <text x="125" y="24" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">DevOps AutoScaler</text>
        <text x="125" y="42" font-size="10" font-family="'JetBrains Mono', monospace" fill="#BFDBFE" text-anchor="middle">Cloud Compute &amp; GPU Provisioning</text>
      </g>

      <!-- Agent 2 -->
      <g transform="translate(275, 0)">
        <rect width="250" height="56" rx="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1" />
        <text x="125" y="24" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Procurement Worker</text>
        <text x="125" y="42" font-size="10" font-family="'JetBrains Mono', monospace" fill="#BFDBFE" text-anchor="middle">SaaS Tooling &amp; Developer Seats</text>
